name: CI

on:
  push:
    # Only main: a work branch is checked through its pull request, once.
    branches: [main]
  pull_request:

# A newer push to the same branch (or PR) cancels the run it makes pointless;
# its own run checks, and on main deploys, everything the older one had.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/songverse_test?schema=public"

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: songverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @oneverse/db exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  # What a push changes: whether more than documentation (the user docs in
  # apps/docs, the website in apps/site, the specs in docs/, Markdown
  # files), which the e2e suites have nothing to say about; and which
  # Docker images it can affect (see the docker job).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has no "before" to compare with: treat it as code, every image built.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo 'images=["api","songverse","planiverse","oneverse","docs","site"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if echo "$files" | grep -qvE '^(apps/docs/|apps/site/|docs/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # An image is built when what shapes it changes - its Dockerfile, the
          # dependencies and workspace, how it's built - not for every line of
          # code: build-test and e2e compile and run that already. The docs and
          # the website are built for any change to them (the docs' build
          # checks their links; the website's image, its redirects).
          deps='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|vite\.config\.ts|\.dockerignore|packages/[^/]+/package\.json|packages/tsconfig/)'
          images=()
          echo "$files" | grep -qE "$deps|^Dockerfile\.api$|^apps/api/(package\.json|nest-cli\.json|tsconfig)|^packages/db/prisma/" && images+=('"api"')
          echo "$files" | grep -qE "$deps|^Dockerfile\.songverse$|^apps/web/(package\.json|server\.mjs|vite\.config|tsconfig)" && images+=('"songverse"')
          echo "$files" | grep -qE "$deps|^Dockerfile\.planiverse$|^apps/planiverse/(package\.json|server\.mjs|vite\.config|tsconfig)" && images+=('"planiverse"')
          echo "$files" | grep -qE "$deps|^Dockerfile\.oneverse$|^apps/oneverse/(package\.json|server\.mjs|vite\.config|tsconfig)" && images+=('"oneverse"')
          echo "$files" | grep -qE "$deps|^Dockerfile\.docs$|^apps/docs/" && images+=('"docs"')
          echo "$files" | grep -qE "$deps|^Dockerfile\.site$|^apps/site/" && images+=('"site"')
          echo "images=[$(IFS=,; echo "${images[*]}")]" >> "$GITHUB_OUTPUT"

  e2e:
    # The API and browser suites in e2e/, against production builds of the
    # API and web app. Emails print to the API's output (no email provider
    # configured), which the suites read verification links from.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: songverse_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/songverse_e2e?schema=public"
      E2E_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/songverse_e2e"
      E2E_API_LOG: /tmp/api.log
      REDIS_URL: "redis://localhost:6379"
      AUTH_URL: "http://localhost:3001"
      WEB_URL: "http://localhost:3000"
      API_URL: "http://localhost:3001"
      # Planiverse (issue #241), beside it: the API trusts it, it links sets to Songverse.
      PLANIVERSE_URL: "http://localhost:3002"
      SONGVERSE_URL: "http://localhost:3000"
      # Oneverse (issue #303): where everyone signs in; the apps are its OAuth clients.
      ONEVERSE_URL: "http://localhost:3003"
      # Test-only values; nothing real is protected by them.
      BETTER_AUTH_SECRET: "e2e-only-secret-not-for-production-use"
      SETTINGS_ENCRYPTION_KEY: "e2e-only-settings-key-not-for-production-use"
      MUSICBRAINZ_CONTACT: "https://github.com/Vulcio/Oneverse"
      # Song artwork (issue #85) and song info (issue #22) from the suites' stand-ins for
      # Apple Music (and its API), MusicBrainz, Deezer, Spotify, YouTube, Wikidata and Wikipedia (e2e/lib/fake-providers.mjs).
      ITUNES_SEARCH_URL: "http://localhost:3999"
      MUSICBRAINZ_API_URL: "http://localhost:3999/mb/ws/2/"
      DEEZER_API_URL: "http://localhost:3999/deezer"
      APPLE_MUSIC_API_URL: "http://localhost:3999/applemusic"
      WIKIDATA_API_URL: "http://localhost:3999/wikidata/w/api.php"
      WIKIPEDIA_URL: "http://localhost:3999/wikipedia/{lang}"
      SPOTIFY_API_URL: "http://localhost:3999/spotify"
      SPOTIFY_ACCOUNTS_URL: "http://localhost:3999/spotify-accounts"
      YOUTUBE_API_URL: "http://localhost:3999/youtube"
      # A stand-in push service (e2e/lib/fake-push.mjs) the API may post to, besides the real ones (issue #236).
      PUSH_TEST_ORIGINS: "http://localhost:3997"
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @oneverse/e2e exec playwright install --with-deps chromium

      # The Worker turns recorded takes into Opus with it (issue #127), as in the API/Worker image.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)

      - name: Apply database migrations
        run: pnpm --filter @oneverse/db exec prisma migrate deploy

      - name: Build the API and the web apps
        run: pnpm exec vp run --filter "@oneverse/api..." --filter "@oneverse/web..." --filter "@oneverse/planiverse..." --filter "@oneverse/oneverse..." build

      # The suites use the built-in tags and other metadata the seed adds.
      # It runs after the build, which builds @oneverse/core for it.
      - name: Seed the database
        run: pnpm --filter @oneverse/db seed

      # As in production (issue #92): the Worker runs the background jobs, the API only adds them.
      - name: Start the API, the Worker and the web apps
        run: |
          (cd apps/api && JOBS_IN_API=false PORT=3001 node dist/main.js > /tmp/api.log 2>&1 &)
          # As the Worker is deployed (Deploy.md): without BETTER_AUTH_SECRET or the
          # addresses (issue #96) - only the database, Redis, the settings key, and
          # here the providers' stand-ins.
          (cd apps/api && env -u BETTER_AUTH_SECRET -u AUTH_URL -u WEB_URL -u PLANIVERSE_URL -u ONEVERSE_URL -u API_URL -u E2E_API_LOG node dist/worker.js > /tmp/worker.log 2>&1 &)
          (cd apps/web && PORT=3000 node server.mjs > /tmp/web.log 2>&1 &)
          (cd apps/planiverse && PORT=3002 node server.mjs > /tmp/planiverse.log 2>&1 &)
          (cd apps/oneverse && PORT=3003 node server.mjs > /tmp/oneverse.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && curl -sf http://localhost:3000/ > /dev/null && curl -sf http://localhost:3002/ > /dev/null && curl -sf http://localhost:3003/sign-in > /dev/null && exit 0
            sleep 2
          done
          echo "The API or a web app didn't start"; tail -50 /tmp/api.log /tmp/worker.log /tmp/web.log /tmp/planiverse.log /tmp/oneverse.log; exit 1

      - name: Run the end-to-end suites
        run: pnpm --filter @oneverse/e2e e2e

      - name: Keep screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            e2e/.artifacts/
            /tmp/api.log
            /tmp/worker.log
            /tmp/web.log
            /tmp/planiverse.log
          retention-days: 7

  # Builds the images Dokploy deploys, so a Dockerfile that no longer
  # matches the code fails here rather than on the server. Nothing is pushed.
  # (The docs image also checks every internal link, in its build.)
  # Only the images the push can affect (see changes).
  docker:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile.${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          load: ${{ matrix.image == 'site' }}
          tags: songverse-${{ matrix.image }}:ci
      # The website serves its pages and sends every other path to the app.
      - name: Check the website's redirects
        if: matrix.image == 'site'
        run: |
          docker run -d --name site -p 8080:80 songverse-site:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q 'ready to play'
          curl -sf http://localhost:8080/fr/ | grep -q 'prêts à jouer'
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' 'http://localhost:8080/sets/abc?share=x')" = "301 https://songverse.top/sets/abc?share=x"

  deploy-api:
    needs: [build-test, e2e, docker]
    # A skipped job would skip this one too: deploy when the checks passed and
    # the images built, or had nothing to build (docs-only pushes skip e2e,
    # and so the API's deploy, as before).
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.build-test.result == 'success' && needs.e2e.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Requires DOKPLOY_WEBHOOK_URL secret (a deploy-trigger webhook
      # configured on the API service in Dokploy). Configure this once the
      # VPS + Dokploy app from spec §5 is provisioned.
      - name: Trigger Dokploy deploy
        if: ${{ vars.DOKPLOY_WEBHOOK_URL != '' }}
        run: curl -fsSL -X POST "${{ vars.DOKPLOY_WEBHOOK_URL }}"
