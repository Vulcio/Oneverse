packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
auditConfig:
  ignoreCves:
    - GHSA-ggr8-5vv4-36mx

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - "@nestjs/core"
  - msgpackr-extract

overrides:
  # @nestjs/platform-express 10 brings multer 2.0.2, which reads uploaded
  # files' names as Latin-1 whatever it's told; 2.4 takes defParamCharset
  # (issue #130: "même" came out "mÃªme").
  # One @types/node (Node 22, what runs everything): Vite+'s core is installed
  # once per @types/node version, and `vp dev` loading one copy while TanStack
  # Start's plugins load another left the dev server answering 404.
  "@types/node": ^22.10.5
  body-parser@1: ^1.20.9
  fast-uri@3: ^3.1.9
  js-yaml@4: ^4.3.2
  lodash@4: ^4.18.0
  multer: ^2.5.0
  postcss-selector-parser@6: ^6.1.5
  # Security fixes in packages that others bring in (issue #418), each kept
  # within the version its parent asks for. Drop a line once the parent asks
  # for the fixed version itself (NestJS 10's Express 4 for the first three).
  proxy-addr@2: ^2.0.8
  qs@6: ^6.16.1
  seroval-plugins@1: ~1.6.12
  seroval@1: ~1.6.12
  source-map-js@1: ^1.2.2
  # Vite+ (issue #159): every Vite and Vitest in the workspace is the one
  # vite-plus bundles, so plugins (TanStack Start's) and vp test share one copy.
  # Upgrade these two with the vite-plus version in the package.json files.
  # An override doesn't reach a peer pnpm installs itself: the root, the API
  # (better-auth's optional @tanstack/react-start peer) and packages/app
  # (react-start's vite peer) name vite as that core too, or a plain Vite
  # comes back into the lockfile when the workspace's peers are resolved
  # again (Vitest's, once apps/planiverse came).
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1
patchedDependencies:
  # Typing together (issue #27): y-tiptap 3.0.6+ second-guesses where a cursor goes after someone else's
  # change and puts it back at its old offset whenever their change is in the same line (the text differs, so
  # Yjs's answer is taken as wrong). Yjs's answer is kept, unless it found none or the very start.
  '@tiptap/y-tiptap@3.0.10': patches/@tiptap__y-tiptap@3.0.10.patch

peerDependencyRules:
  allowedVersions:
    # Vite+'s core is Vite 8 under its own version number (1.x), which
    # plugins' "vite: ^8" peer ranges don't recognise.
    vite: "*"
